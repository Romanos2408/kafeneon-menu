<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b9cdb4" />
  <title>Η ΓΩΝΙΑ — Καφενεόν · Menu</title>
  <meta name="description" content="Καφενεόν Η Γωνία — Ψηφιακός κατάλογος" />
  <link rel="icon" href="assets/logo.jpeg" />
  <link rel="apple-touch-icon" href="assets/logo.jpeg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <img class="hero-logo" src="assets/logo.jpeg" alt="Η ΓΩΝΙΑ — ΚΑΦΕΝΕΟΝ" />
    <p class="brand-tag" id="tagline">Taste the true coffee</p>
    <p class="brand-address" id="address">Ελευθερίου Βενιζέλου 133, Χρυσούπολη 64200</p>
  </header>

  <nav class="lang">
    <button class="lang-btn active" data-lang="el" type="button">ΕΛ</button>
    <button class="lang-btn" data-lang="en" type="button">EN</button>
  </nav>

  <div class="search">
    <input id="search" type="search" placeholder="Αναζήτηση…" autocomplete="off" />
  </div>

  <nav class="cat-nav" id="cat-nav" aria-label="Κατηγορίες"></nav>

  <main id="menu" class="menu" aria-live="polite"></main>

  <footer class="foot">
    <p id="foot-shop">Η ΓΩΝΙΑ · ΚΑΦΕΝΕΟΝ</p>
    <p class="foot-sm">Τιμές σε ευρώ. Συμπεριλαμβάνεται ΦΠΑ.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
